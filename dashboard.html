<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루칸 서버 - 포인트 대시보드</title>
    <!-- Socket.IO 클라이언트 라이브러리 -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard-card {
            width: 100%;
            max-width: 420px;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }
        
        /* 내 잔액 섹션 */
        .balance-box {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-label {
            font-size: 14px;
            color: #e0e7ff;
        }
        .balance-amount {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        /* 입력 폼 섹션 */
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #94a3b8;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: #38bdf8;
        }

        /* 2차 프로필 확인 카드리스트 */
        .profile-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .profile-card img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .profile-name {
            font-weight: 600;
            font-size: 14px;
        }
        .profile-tag {
            font-size: 11px;
            color: #64748b;
        }

        /* 수수료 명세서 Box */
        .fee-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
        }
        .fee-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .fee-row:last-child {
            margin-bottom: 0;
            padding-top: 6px;
            border-top: 1px dashed #334155;
        }

        /* 에러 메시지 */
        .error-text {
            color: #f87171;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        /* 전송 버튼 */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #38bdf8;
            color: #0f172a;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover:not(:disabled) {
            background-color: #7dd3fc;
        }
        .btn-submit:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="title">💎 루칸 포인트 대시보드</div>

    <!-- 1. 내 보유 포인트 영역 -->
    <div class="balance-box">
        <span class="balance-label">내 보유 포인트</span>
        <span class="balance-amount"><span id="myPointDisplay">0</span> P</span>
    </div>

    <!-- 2. 받는 사람 디스코드 ID 입력 -->
    <div class="form-group">
        <label class="form-label" for="targetIdInput">받는 사람 디스코드 ID</label>
        <input type="text" id="targetIdInput" class="form-input" placeholder="18자리 디스코드 ID 입력" oninput="fetchUserProfile()">
        
        <!-- 프로필 2차 확인 영역 -->
        <div id="profileContainer" class="profile-card" style="display: none;">
            <img id="userAvatar" src="" alt="Avatar">
            <div>
                <div class="profile-name" id="userName">유저이름</div>
                <div class="profile-tag" id="userIdTag">ID: -</div>
            </div>
        </div>
    </div>

    <!-- 3. 보낼 포인트 수량 입력 -->
    <div class="form-group">
        <label class="form-label" for="amountInput">보낼 포인트</label>
        <input type="number" id="amountInput" class="form-input" min="1" placeholder="보낼 수량 입력" oninput="validateAndCalculate()">
        
        <!-- 경고 메시지 영역 -->
        <div id="errorMessage" class="error-text">❌ 보유 포인트보다 큰 금액은 보낼 수 없습니다.</div>
    </div>

    <!-- 4. 수수료 및 수령액 명세서 -->
    <div id="feeBox" class="fee-card" style="display: none;">
        <div class="fee-row">
            <span>차감 포인트</span>
            <strong id="sendAmountText">0 P</strong>
        </div>
        <div class="fee-row">
            <span>수수료 (10%)</span>
            <span id="feeText" style="color: #f87171;">0 P</span>
        </div>
        <div class="fee-row">
            <span>상대방 실제 수령액</span>
            <strong id="receiveAmountText" style="color: #4ade80;">0 P</strong>
        </div>
    </div>

    <!-- 5. 전송 버튼 -->
    <button id="sendBtn" class="btn-submit" onclick="confirmAndSend()" disabled>유저 확인 필요</button>
</div>

<script>
    // 🌐 Socket.IO 서버 연결 설정
    const RENDER_SERVER_URL = "https://luacn-server-point-bot-deshboard.onrender.com";
    const socket = io(RENDER_SERVER_URL);

    // ⚠️ 실서비스 연결 시 로그인된 유저의 디스코드 ID 세션/변수값을 넣으세요.
    const myDiscordId = "123456789012345678"; 

    let myCurrentPoints = 0;
    let isUserVerified = false;
    let selectedUserObj = null;

    // 1. 소켓 연결 후 내 잔액 조회 요청
    socket.on("connect", () => {
        console.log("🌐 Socket.IO 서버 연결 성공");
        socket.emit("get_user_point", { discordId: myDiscordId });
    });

    // 봇/서버로부터 내 잔액 데이터 수신
    socket.on("user_point_response", (data) => {
        if (data.discordId === myDiscordId) {
            myCurrentPoints = data.points;
            document.getElementById("myPointDisplay").innerText = myCurrentPoints.toLocaleString();
            validateAndCalculate(); // 잔액 변경 시 입력창 재검증
        }
    });

    // 2. 유저 프로필 불러오기 (2차 실시간 검증)
    async function fetchUserProfile() {
        const targetId = document.getElementById("targetIdInput").value.trim();
        const profileContainer = document.getElementById("profileContainer");

        // 본인에게 송금 차단
        if (targetId === myDiscordId) {
            profileContainer.style.display = "none";
            isUserVerified = false;
            updateButtonState("본인에게는 송금할 수 없습니다");
            return;
        }

        // 유효 ID 길에 체크
        if (targetId.length < 17 || isNaN(targetId)) {
            profileContainer.style.display = "none";
            isUserVerified = false;
            updateButtonState("올바른 디스코드 ID를 입력해 주세요");
            return;
        }

        try {
            const response = await fetch(`https://api.lanyard.rest/v1/users/${targetId}`);
            const data = await response.json();

            if (data.success) {
                const user = data.data.discord_user;
                selectedUserObj = user;

                document.getElementById("userName").innerText = user.global_name || user.username;
                document.getElementById("userIdTag").innerText = `@${user.username}`;
                document.getElementById("userAvatar").src = user.avatar 
                    ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                    : `https://cdn.discordapp.com/embed/avatars/0.png`;

                profileContainer.style.display = "flex";
                isUserVerified = true;
                validateAndCalculate();
            } else {
                profileContainer.style.display = "none";
                isUserVerified = false;
                updateButtonState("존재하지 않는 디스코드 유저입니다");
            }
        } catch (err) {
            profileContainer.style.display = "none";
            isUserVerified = false;
            updateButtonState("유저 정보를 불러올 수 없습니다");
        }
    }

    // 3. 음수 차단, 잔액 검증 및 수수료 자동 계산
    function validateAndCalculate() {
        const amountInput = document.getElementById("amountInput");
        const feeBox = document.getElementById("feeBox");
        const errorMessage = document.getElementById("errorMessage");
        let amount = parseInt(amountInput.value);

        // 🛑 [검증 1] 음수 및 0 이하 입력 강력 차단
        if (isNaN(amount) || amount <= 0) {
            amountInput.value = "";
            feeBox.style.display = "none";
            errorMessage.style.display = "none";
            updateButtonState("1P 이상의 포인트를 입력해 주세요");
            return;
        }

        // 🛑 [검증 2] 잔액 부족 차단
        if (amount > myCurrentPoints) {
            feeBox.style.display = "none";
            errorMessage.style.display = "block";
            updateButtonState("보유 포인트가 부족합니다");
            return;
        } else {
            errorMessage.style.display = "none";
        }

        // 🧮 봇 명령어 기준 동일 수수료 로직 (1P 이하는 -1P, 2P 이상은 10% 수수료)
        let actualReceive = amount <= 1 ? 0 : Math.floor(amount * 0.9);
        let fee = amount - actualReceive;

        document.getElementById("sendAmountText").innerText = `${amount.toLocaleString()} P`;
        document.getElementById("feeText").innerText = `${fee.toLocaleString()} P`;
        document.getElementById("receiveAmountText").innerText = `${actualReceive.toLocaleString()} P`;
        feeBox.style.display = "block";

        if (isUserVerified) {
            const sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = false;
            sendBtn.innerText = "포인트 전송하기";
        }
    }

    function updateButtonState(message) {
        const sendBtn = document.getElementById("sendBtn");
        sendBtn.disabled = true;
        sendBtn.innerText = message;
    }

    // 4. 최종 전송 처리 및 2차 확인 팝업
    function confirmAndSend() {
        const targetId = document.getElementById("targetIdInput").value.trim();
        const amount = parseInt(document.getElementById("amountInput").value);

        if (!isUserVerified || amount > myCurrentPoints || amount <= 0) {
            alert("송금 정보를 다시 확인해 주세요.");
            return;
        }

        const userName = selectedUserObj ? (selectedUserObj.global_name || selectedUserObj.username) : targetId;
        
        // 2차 확인 Confirm 창
        const confirmResult = confirm(
            `[포인트 송금 확인]\n\n` +
            `• 받는 유저: ${userName} (${targetId})\n` +
            `• 차감 포인트: ${amount.toLocaleString()} P\n\n` +
            `정말로 전송하시겠습니까?`
        );

        if (confirmResult) {
            // Socket.IO 이벤트 발송
            socket.emit("update_user_point", {
                senderId: myDiscordId,
                targetId: targetId,
                amount: amount
            });

            alert("✅ 포인트 전송 요청이 성공적으로 완료되었습니다!");
            
            // 입력 폼 초기화
            document.getElementById("amountInput").value = "";
            document.getElementById("feeBox").style.display = "none";
            validateAndCalculate();
            
            // 잔액 재갱신 요청
            socket.emit("get_user_point", { discordId: myDiscordId });
        }
    }
</script>

</body>
</html>
