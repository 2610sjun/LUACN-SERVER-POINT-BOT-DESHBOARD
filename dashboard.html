<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루칸 포인트 대시보드</title>
    <style>
        body {
            background-color: #1e1f22;
            color: #dbdee1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #2b2d31;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #3f4147;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        .nav-links {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .nav-links a {
            background: #35363c;
            color: white; /* 오타 수정 완료 (#white -> white) */
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        .nav-links a:hover {
            background: #404249;
        }
        .card {
            background: #313338;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            background: #1e1f22;
            border: 1px solid #3f4147;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        select[size] {
            height: 120px;
        }
        button {
            background: #5865f2;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #4752c4;
        }
        .point-display {
            font-size: 24px;
            font-weight: bold;
            color: #fEE75C;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="user-info">
                <img id="my-avatar" class="user-avatar" src="" alt="프로필">
                <div>
                    <h3 id="my-username" style="margin: 0;">로딩 중...</h3>
                    <p style="margin: 0; font-size: 12px; color: #949ba4;">접속 유저</p>
                </div>
            </div>
            <div>
                <a href="/logout" style="color: #ed4245; text-decoration: none; font-size: 14px;">로그아웃</a>
            </div>
        </div>

        <div class="nav-links">
            <a href="/dashboard">대시보드</a>
            <a href="/shop">포인트 상점</a>
            <a href="/ranking">실시간 랭킹</a>
        </div>

        <div class="card">
            <h3>💰 내 보유 포인트</h3>
            <div class="point-display" id="my-points">불러오는 중...</div>
        </div>

        <div class="card">
            <h3>💸 포인트 송금하기</h3>
            
            <label>받을 유저 검색:</label>
            <input type="text" id="user-search-input" placeholder="유저 닉네임 검색...">

            <label>보낼 유저 선택:</label>
            <select id="target-user-select" size="5">
                <option value="">유저 목록을 불러오는 중...</option>
            </select>

            <label>보낼 금액:</label>
            <input type="number" id="transfer-amount" placeholder="금액 입력 (수수료 10% 제외 후 지급)">

            <button id="send-btn">송금하기</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUserId = null;
        let allUsers = [];

        fetch('/api/user')
            .then(res => res.json())
            .then(data => {
                myUserId = data.id;
                document.getElementById('my-username').textContent = data.username;
                document.getElementById('my-avatar').src = data.avatar;
                socket.emit('request_user_point', { user_id: myUserId });
            });

        function loadTransferUserList() {
            socket.emit('request_ranking');
        }

        socket.on('update_ranking_data', (rankings) => {
            allUsers = rankings.filter(u => u.user_id !== myUserId);
            renderUserOptions(allUsers);
        });

        function renderUserOptions(users) {
            const selectBox = document.getElementById('target-user-select');
            selectBox.innerHTML = '';
            
            if (users.length === 0) {
                selectBox.innerHTML = '<option value="">선택 가능한 유저가 없습니다.</option>';
                return;
            }

            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user.user_id;
                option.textContent = `${user.username} (보유: ${user.points}P)`;
                selectBox.appendChild(option);
            });
        }

        document.getElementById('user-search-input').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allUsers.filter(user => user.username.toLowerCase().includes(keyword));
            renderUserOptions(filtered);
        });

        socket.on('update_user_point', (data) => {
            if (data.user_id === myUserId) {
                document.getElementById('my-points').textContent = `${data.point.toLocaleString()} P`;
            }
        });

        document.getElementById('send-btn').addEventListener('click', () => {
            const targetId = document.getElementById('target-user-select').value;
            const amount = parseInt(document.getElementById('transfer-amount').value);

            if (!targetId) {
                alert('송금할 상대를 선택해주세요!');
                return;
            }
            if (!amount || amount <= 0) {
                alert('올바른 금액을 입력해주세요!');
                return;
            }

            if (confirm(`${amount.toLocaleString()} 포인트를 송금하시겠습니까? (수수료 10% 제외)`)) {
                socket.emit('submit_transfer', {
                    sender_id: myUserId,
                    target_id: targetId,
                    amount: amount
                });
            }
        });

        socket.on('transfer_response', (data) => {
            if (data.user_id === myUserId) {
                alert(data.message);
                if (data.success) {
                    document.getElementById('transfer-amount').value = '';
                    socket.emit('request_user_point', { user_id: myUserId });
                }
            }
        });

        setTimeout(loadTransferUserList, 500);
    </script>
</body>
</html>
